packages:
  - "apps/*"
  - "packages/*"

# Supply-chain policy: opt out of the minimum release-age delay so the repo
# always installs the latest published versions. This is intentional — all
# versions are pinned in pnpm-lock.yaml and updates are reviewed on commit.
minimumReleaseAge: 0

# Lifecycle scripts for native/binary modules (pnpm 12 blocks these by default).
allowBuilds:
  "@swc/core": true
  "@tailwindcss/node": true
  "@tailwindcss/oxide": true
  esbuild: true
  sharp: true
  unrs-resolver: true

overrides:
  postcss: ^8.5.29
  # Collapse transitive duplicates onto a single, current version.
  # commander: terser (via Remotion's webpack + vite) still pins ^2; we use 15.
  # Only terser's CLI loads commander, and we never invoke it.
  commander: ^15.0.0
  zod: ^4.6.6