name: "CodeQL Analysis"

on:
  push:
    branches: [ master, main, "feature/**" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ master, main ]
  schedule:
    - cron: "0 0 * * 0" # weekly

jobs:
  analyze:
    name: Analyze
    # Pinned instead of ubuntu-latest: the "latest" label starts migrating to
    # Ubuntu 26 on 2026-10-19, and a floating image makes scans non-reproducible.
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      matrix:
        # The "javascript" pack analyzes JavaScript and TypeScript alike.
        # Listing both languages analysed the same files twice and produced
        # duplicate alerts.
        language: ["javascript"]
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}

    - name: Autobuild
      uses: github/codeql-action/autobuild@v4

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: ${{ matrix.language }}
        upload: true
        # Output SARIF files are automatically uploaded to the security tab.
