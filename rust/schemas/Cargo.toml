[package]
name = "schemas"
version = "0.1.0"
edition = "2021"
description = "Rust type definitions for Virtue Studio - single source of truth for Zod schemas"
license = "MIT"
repository = "https://github.com/virtuewise/ads"

[lib]
name = "schemas"

[dependencies]
serde = { workspace = true, features = ["derive"] }
schemars = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
uuid = { version = "1.8", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }