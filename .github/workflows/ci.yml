name: CI
permissions:
  contents: read
  actions: read
  security-events: write
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  RUSTFLAGS: "-D warnings"
  CARGO_TERM_COLOR: always

jobs:
  rust-toolchain:
    name: Rust Toolchain
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: rust-${{ hashFiles('**/Cargo.lock') }}
          workdir: rust

      - name: Install cargo tools
        run: |
          cargo install cargo-nextest cargo-make typos-cli --locked

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.11.2

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'pnpm'

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Run cargo-make ci
        run: cargo make ci
        working-directory: .

  typescript:
    name: TypeScript Build & Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.11.2

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm --filter @printsync/renderer run typecheck

      - name: Test
        run: pnpm test

  render:
    name: Render Verification
    runs-on: ubuntu-24.04
    needs: [rust-toolchain, typescript]
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.11.2

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build renderer and its dependencies
        run: pnpm --filter "@printsync/renderer..." build

      - name: Render still frames (verification)
        run: |
          pnpm --filter @printsync/renderer exec remotion still src/index.ts PrintSyncLivingCity /tmp/still.png --frame=200 --log=error
          pnpm --filter @printsync/renderer exec remotion still src/index.ts PrintSyncLivingCity /tmp/still-shop.png --frame=560 --log=error
          pnpm --filter @printsync/renderer exec remotion still src/index.ts PrintSyncLivingCity /tmp/still-board.png --frame=760 --log=error

      - name: Upload stills
        uses: actions/upload-artifact@v7
        with:
          name: verification-stills
          path: /tmp/*.png
          retention-days: 7

  deploy-wiki:
    name: Deploy Wiki
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    needs: [rust-toolchain, typescript]
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Sync wiki
        run: |
          git clone https://x-access-token:${GITHUB_TOKEN}@github.com/virtuewise/ads.wiki.git wiki
          cp docs/wiki/* wiki/
          cd wiki
          git config user.email "bot@virtuewise.com"
          git config user.name "Virtue Bot"
          git add -A
          git commit -m "Sync wiki from repo" || true
          git push origin master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true